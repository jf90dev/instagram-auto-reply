# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  deploy:
    name: Deploy Prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Prod
    concurrency:
      group: deploy-Prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        id: set_up_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: Build (compile, test, synth)
        id: build_compile_test_synth
        run: npx projen build
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: instagram-auto-reply-deploy
      - name: Deploy
        id: deploy
        run: npx cdk deploy --app cdk.out "Prod/*" --require-approval never --concurrency 3
